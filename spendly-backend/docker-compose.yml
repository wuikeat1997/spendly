name: spendly
services:
  postgres:
    container_name: postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spendly
      POSTGRES_USER: spendly
      POSTGRES_PASSWORD: spendly
    ports:
      - "5432:5432"
    volumes:
      - spendly-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendly -d spendly"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    container_name: mailpit
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    container_name: backend
    build:
      context: .
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/spendly
      SPRING_DATASOURCE_USERNAME: spendly
      SPRING_DATASOURCE_PASSWORD: spendly
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,https://spendly-tawny-two.vercel.app
      APP_FRONTEND_URL: http://localhost:3000
      APP_MAIL_FROM: no-reply@spendly.com
      JWT_SECRET: local-docker-secret-local-docker-secret-local-docker-secret
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  spendly-postgres-data:
