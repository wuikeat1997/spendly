server:
  port: ${PORT:8080}

spring:
  application:
    name: spendly-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:spendly}}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:spendly}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:spendly}}
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
      connection-timeout: 10000
      idle-timeout: 600000
  liquibase:
    change-log: classpath:liquibase/master.xml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,https://spendly-tawny-two.vercel.app}
  frontend:
    url: ${APP_FRONTEND_URL:https://spendly-tawny-two.vercel.app}
  mail:
    provider: ${APP_MAIL_PROVIDER:smtp}
    from: ${APP_MAIL_FROM:no-reply@spendly.com}
    resend:
      api-key: ${RESEND_API_KEY:}
      api-url: ${RESEND_API_URL:https://api.resend.com/emails}
  jwt:
    secret: ${JWT_SECRET:bO8EEH/9fYZ4V/RNtGNSxDfnLpSWjMsuv3/fQNk3IV5n4s88VVaW+Pivi6zwZflTKEM6KQHwiuen/7UzYe1xzONVJtNo7JKoNdyxlpujOzN6AKrO87QjGrqod9MEaAJ5NxXbS9Mb5uEIlB9xsCWyi6Q1vRi+4wQ89JuArWhXSow=}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:60}
    refresh-token-days: ${JWT_REFRESH_TOKEN_DAYS:30}
  otp:
    expiry-minutes: ${OTP_EXPIRY_MINUTES:10}
    send-limit: ${OTP_SEND_LIMIT:2}
    send-window-seconds: ${OTP_SEND_WINDOW_SECONDS:60}
    verify-limit: ${OTP_VERIFY_LIMIT:5}
    verify-window-minutes: ${OTP_VERIFY_WINDOW_MINUTES:10}
